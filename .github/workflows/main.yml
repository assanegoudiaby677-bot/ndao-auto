name: Fabriquer APK NDAO AUTO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Nettoyer les caractères invisibles
        run: |
          find . -name "*.json" -exec sed -i '1s/^\xEF\xBB\xBF//' {} +

      - name: 3. Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Installer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Installer les dépendances
        run: npm install

      - name: 6. Préparer Android
        run: npx expo prebuild --platform android --no-install

      - name: 7. Définir la couleur de l'écran de démarrage
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<resources><color name="splashscreen_background">#07162c</color></resources>' > android/app/src/main/res/values/splashscreen_colors.xml

      - name: 8. Permissions Gradle
        run: chmod +x android/gradlew

      - name: 9. Compiler l'APK physique
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 10. Mettre à disposition l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NDAO-AUTO-Application
          path: android/app/build/outputs/apk/debug/*.apk
