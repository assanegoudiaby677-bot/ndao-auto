name: Fabriquer APK NDAO AUTO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Installer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Installer les dépendances
        run: npm install

      - name: 5. Préparer Android
        run: npx expo prebuild --platform android --no-install

      - name: 6. Compiler l'APK physique
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 7. Enregistrer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: NDAO-AUTO-Application
          path: android/app/build/outputs/apk/debug/*.apk
